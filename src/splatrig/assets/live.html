<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SplatRig Live</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #000; --panel: rgba(28, 28, 30, .9); --panel-solid: #1c1c1e; --line: rgba(255, 255, 255, .12);
  --text: #fff; --muted: rgba(235, 235, 245, .6); --accent: #0a84ff; --ok: #30d158; --warn: #ff9f0a;
  --bad: #ff453a; --rec: #ff453a; --shadow: 0 1px 3px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: fixed; inset: 0; }
canvas#cloud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.shade-top, .shade-bottom { position: absolute; left: 0; right: 0; pointer-events: none; }
.shade-top { top: 0; height: 120px; background: linear-gradient(rgba(0, 0, 0, .55), transparent); }
.shade-bottom { bottom: 0; height: 200px; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); }
body.alarm #stage::after { content: ""; position: absolute; inset: 0; border: 5px solid var(--bad); border-radius: 28px;
  pointer-events: none; }

/* top bar */
.top { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  gap: 8px; padding: max(12px, env(safe-area-inset-top)) 14px 0; pointer-events: none; }
.top > * { pointer-events: auto; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.ok > .dot { background: var(--ok); } .warn > .dot { background: var(--warn); } .bad > .dot { background: var(--bad); }
.center { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.timer { padding: 5px 14px; border-radius: 9px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--panel);
  text-shadow: var(--shadow); }
.timer.rec { background: var(--rec); }
.guide { max-width: min(560px, 92vw); padding: 7px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  text-align: center; font-size: 13px; text-shadow: var(--shadow); }
.guide:empty { display: none; }
.guide.bad { border-color: var(--bad); color: #ffd6d3; } .guide.warn { border-color: var(--warn); color: #ffe2b8; }
.guide.good { border-color: var(--ok); color: #c9f5d4; }
.stats { justify-self: end; text-align: right; font-size: 13px; text-shadow: var(--shadow); padding-top: 8px; line-height: 1.5; }
.stats b { font-weight: 600; }
.devices { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 44px); left: 14px; width: min(320px, calc(100vw - 28px));
  padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
.devices ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.devices li { display: flex; align-items: center; gap: 8px; }
.devices .note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }

/* right tool rail */
.rail { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; padding: 7px 2px; border-radius: 12px;
  background: rgba(28, 28, 30, .75); border: 1px solid var(--line); font-size: 11px; text-shadow: var(--shadow); }
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }

/* camera picture-in-picture */
.pip { position: absolute; right: 86px; top: calc(max(12px, env(safe-area-inset-top)) + 56px); width: min(320px, 40vw);
  aspect-ratio: 2 / 1; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.pip img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pip span { position: absolute; left: 6px; top: 6px; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, .6); }

/* bottom: mini-map, shutter */
.bottom { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
  padding: 0 16px max(16px, env(safe-area-inset-bottom)); pointer-events: none; }
.bottom > * { pointer-events: auto; }
.minimap { grid-column: 1; justify-self: start; width: 132px; height: 132px; border-radius: 16px; background: rgba(28, 28, 30, .8);
  border: 1px solid var(--line); }
.shutter-wrap { grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.motion { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); font-size: 12px; }
.motion .bar { width: 120px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.motion .fill { height: 100%; width: 0; background: var(--ok); }
.shutter { position: relative; width: 84px; height: 84px; border: 0; padding: 0; background: none; border-radius: 50%; }
.shutter svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.shutter circle { fill: none; stroke-width: 5; }
.shutter .track { stroke: rgba(255, 255, 255, .9); }
.shutter.active .track { stroke: rgba(255, 255, 255, .25); }
.shutter .ring { stroke: var(--bad); stroke-linecap: round; stroke-dasharray: 238.76; stroke-dashoffset: 238.76; transition: stroke-dashoffset .4s; }
.shutter .core { position: absolute; inset: 12px; border-radius: 50%; background: var(--rec); transition: all .2s; }
.shutter.active .core { inset: 26px; border-radius: 8px; }
.shutter-label { font-size: 13px; text-shadow: var(--shadow); }
.spacer { grid-column: 3; justify-self: end; width: 132px; }
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); max-width: 90vw; padding: 8px 14px;
  border-radius: 12px; background: var(--panel-solid); border: 1px solid var(--bad); color: #ffd6d3; font-size: 13px; }
.toast:empty { display: none; }
.hint { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); color: var(--muted); text-align: center;
  pointer-events: none; text-shadow: var(--shadow); }

/* bottom sheet */
.sheet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100vw); max-height: 86vh;
  overflow: auto; background: var(--panel-solid); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0;
  padding: 16px 18px max(18px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0, 0, 0, .5); }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 17px; }
.close { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .12); }
.sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; margin: -6px 0 12px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.fact { background: rgba(255, 255, 255, .06); border-radius: 10px; padding: 8px; }
.fact b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.fact span { color: var(--muted); font-size: 11px; }
.notes { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.notes li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.notes li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
.notes li.warn::before { background: var(--warn); } .notes li.bad::before { background: var(--bad); }
.notes li.good::before { background: var(--ok); }
.actions { display: grid; gap: 8px; }
.primary, .secondary { min-height: 46px; border-radius: 12px; font-weight: 600; border: 1px solid transparent; }
.primary { background: #fff; color: #000; }
.secondary { background: rgba(255, 255, 255, .1); border-color: var(--line); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
details { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
details label { display: inline-flex; align-items: center; gap: 4px; margin: 8px 10px 0 0; color: var(--text); }
details input { width: 80px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: #000; color: var(--text); font: inherit; }
.steps { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; color: var(--muted); }
.steps li::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.steps li.done { color: var(--text); } .steps li.done::before { background: var(--ok); border-color: var(--ok); }
.steps li.now { color: var(--text); background: rgba(10, 132, 255, .15); }
.steps li.now::before { border-color: var(--accent); border-top-color: transparent; animation: spin 1s linear infinite; }
.steps li.failed { color: #ffd6d3; } .steps li.failed::before { background: var(--bad); border-color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.now::before { animation: none; } .shutter .ring, .shutter .core { transition: none; } }
.progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-bottom: 12px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); }
.list small { display: block; color: var(--muted); }
.path { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; color: var(--muted); margin: 0 0 12px; }

@media (max-width: 640px) {
  .top { grid-template-columns: auto 1fr; } .stats { grid-column: 1 / -1; grid-row: 3; justify-self: center; text-align: center; padding: 0; }
  .center { grid-column: 2; } .rail { right: 6px; } .tool { width: 54px; font-size: 10px; }
  .minimap { width: 96px; height: 96px; } .spacer { width: 96px; } .pip { right: 66px; width: 46vw; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cloud" tabindex="0" aria-label="Point cloud. Drag or arrow keys to orbit, wheel or +/- to zoom, R to reset."></canvas>
  <div class="shade-top"></div><div class="shade-bottom"></div>
  <div class="hint" id="hint">Waiting for the LiDAR…</div>

  <header class="top">
    <button class="pill" id="devices" type="button" aria-expanded="false" aria-controls="device-panel">
      <span class="dot"></span><span>Devices</span></button>
    <div class="center">
      <div class="timer" id="timer">Ready</div>
      <div class="guide" id="guide" role="status" aria-live="polite"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="devices" id="device-panel" hidden>
    <ul>
      <li id="d-lidar"><span class="dot"></span><span>LiDAR —</span></li>
      <li id="d-imu"><span class="dot"></span><span>IMU —</span></li>
      <li id="d-clock"><span class="dot"></span><span>Clock —</span></li>
      <li id="d-cam"><span class="dot"></span><span>MAX2 —</span></li>
      <li id="d-slam"><span class="dot"></span><span>SLAM —</span></li>
      <li id="d-cal"><span class="dot"></span><span>Calibration —</span></li>
    </ul>
    <p class="note">The map is a preview; datasets are rebuilt from the recording.</p>
  </div>

  <nav class="rail" aria-label="View tools">
    <button class="tool" type="button" id="t-follow" aria-pressed="true" title="Keep the view behind the rig, heading up">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Follow</button>
    <button class="tool" type="button" id="t-top" aria-pressed="false" title="Look straight down">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>Top view</button>
    <button class="tool" type="button" id="t-cover" aria-pressed="false" title="Colour the map by how many directions the photos saw it from">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M7 12a5 5 0 0 1 10 0"/><circle cx="12" cy="12" r="1"/></svg>Coverage</button>
    <button class="tool" type="button" id="t-ceiling" aria-pressed="true" title="Hide points more than 1 m above the rig">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M3 4l18 16"/></svg>Ceiling</button>
    <button class="tool" type="button" id="t-live" aria-pressed="true" title="Show the newest LiDAR scan in cyan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2"/></svg>Live scan</button>
    <button class="tool" type="button" id="t-camera" aria-pressed="false" title="MAX2 preview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M8 7l2-3h4l2 3"/></svg>Camera</button>
    <button class="tool" type="button" id="t-captures" aria-pressed="false" title="Recorded captures and processing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Captures</button>
  </nav>

  <div class="pip" id="pip" hidden><span>MAX2 preview · not exposure-timed</span></div>

  <div class="bottom">
    <canvas class="minimap" id="minimap" width="264" height="264" role="img" aria-label="Mini-map: route and coverage around the rig, heading up"></canvas>
    <div class="shutter-wrap">
      <div class="motion" id="motion" hidden><span aria-hidden="true">slow</span><div class="bar"><div class="fill" id="motion-fill"></div></div><span aria-hidden="true">fast</span></div>
      <button class="shutter" id="rec" type="button" aria-label="Start scanning">
        <svg viewBox="0 0 84 84" aria-hidden="true"><circle class="track" cx="42" cy="42" r="38"/><circle class="ring" id="ring" cx="42" cy="42" r="38"/></svg>
        <span class="core"></span>
      </button>
      <div class="shutter-label" id="rec-label">Start scanning</div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="toast" id="err" role="alert"></div>

  <section class="sheet" id="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="close" id="sheet-close" type="button" aria-label="Close">✕</button></div>
    <div id="sheet-body"></div>
  </section>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => { const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k.startsWith("aria") || k === "style") n.setAttribute(k === "style" ? k : "aria-" + k.slice(4).toLowerCase(), v); else n[k] = v; }
  for (const c of children) if (c != null) n.append(c); return n; };
const post = (path, data) => fetch(path, {method: "POST",
    headers: data ? {"X-SplatRig": "1", "Content-Type": "application/json"} : {"X-SplatRig": "1"},
    body: data ? JSON.stringify(data) : undefined})
  .then(async (r) => { const body = await r.json(); if (!r.ok) throw new Error(body.error || r.status); return body; });
let errTimer = 0;
const showError = (e) => { $("err").textContent = e ? String(e.message || e) : ""; clearTimeout(errTimer);
  if (e) errTimer = setTimeout(() => { $("err").textContent = ""; }, 8000); };

// ---------- WebGL point renderer ----------
const canvas = $("cloud");
const gl = canvas.getContext("webgl", {antialias: false});
const vs = `attribute vec4 a; uniform mat4 m; uniform float s; uniform int mode; uniform float zmax; varying vec3 c;
vec3 ramp(float t){ t=clamp(t,0.,1.); return clamp(vec3(1.5-abs(4.*t-3.),1.5-abs(4.*t-2.),1.5-abs(4.*t-1.)),0.,1.); }
vec3 cover(float t){ t=clamp(t,0.,1.); return t<.5 ? mix(vec3(1.,.27,.23),vec3(1.,.62,.04),t*2.) : mix(vec3(1.,.62,.04),vec3(.19,.82,.35),t*2.-1.); }
void main(){ gl_Position = a.z > zmax ? vec4(2.,2.,2.,1.) : m*vec4(a.xyz,1.); gl_PointSize=s;
  c = mode==0 ? ramp((a.z+1.5)/4.) : mode==2 ? cover(a.w/30.) : vec3(.4); }`;
const fs = `precision mediump float; varying vec3 c; uniform float u; uniform vec3 solid; void main(){ gl_FragColor=vec4(u>0.?c:solid,1.); }`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
const loc = {a: gl.getAttribLocation(prog, "a"), m: gl.getUniformLocation(prog, "m"), s: gl.getUniformLocation(prog, "s"),
  mode: gl.getUniformLocation(prog, "mode"), u: gl.getUniformLocation(prog, "u"),
  solid: gl.getUniformLocation(prog, "solid"), zmax: gl.getUniformLocation(prog, "zmax")};
const cloudBuf = gl.createBuffer(), gridBuf = gl.createBuffer(), mapBuf = gl.createBuffer(),
  routeBuf = gl.createBuffer(), markBuf = gl.createBuffer(), scanBuf = gl.createBuffer(), cellBuf = gl.createBuffer();
let cloudCount = 0, mapCount = 0, routeCount = 0, markCount = 0, scanCount = 0, cellCount = 0, viewMode = "";
const tools = {follow: true, top: false, cover: false, ceiling: true, live: true, camera: false};
const target = [0, 0, 0];
let heading = 0, route = new Float32Array(0), cells = new Float32Array(0);
const grid = [];
for (let r = 5; r <= 30; r += 5) for (let i = 0; i < 64; i++) {
  const a0 = i / 64 * 2 * Math.PI, a1 = (i + 1) / 64 * 2 * Math.PI;
  grid.push(r * Math.cos(a0), r * Math.sin(a0), 0, 0, r * Math.cos(a1), r * Math.sin(a1), 0, 0);
}
gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(grid), gl.STATIC_DRAW);

const home = {yaw: -2.4, pitch: 0.55, dist: 18};
const view = {...home};
function mat(yaw, pitch, dist, aspect, t) {
  const f = 1 / Math.tan(0.5), n = 0.05, far = 400;
  const p = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + n) / (n - far), -1, 0, 0, 2 * far * n / (n - far), 0];
  const cp = Math.cos(pitch), off = [dist * cp * Math.cos(yaw), dist * cp * Math.sin(yaw), dist * Math.sin(pitch)];
  const e = [t[0] + off[0], t[1] + off[1], t[2] + off[2]];
  const len = (v) => Math.hypot(...v), norm = (v) => v.map((x) => x / len(v));
  const zf = norm(off), xr = norm([-zf[1], zf[0], 0]);
  const yu = [zf[1] * xr[2] - zf[2] * xr[1], zf[2] * xr[0] - zf[0] * xr[2], zf[0] * xr[1] - zf[1] * xr[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const v = [xr[0], yu[0], zf[0], 0, xr[1], yu[1], zf[1], 0, xr[2], yu[2], zf[2], 0, -dot(xr, e), -dot(yu, e), -dot(zf, e), 1];
  const out = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += p[k * 4 + r] * v[c * 4 + k]; out[c * 4 + r] = s;
  }
  return out;
}
function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  const map = viewMode === "map";
  gl.uniform1f(loc.zmax, map && tools.ceiling ? target[2] + 1.0 : 1e9);
  gl.uniformMatrix4fv(loc.m, false, mat(view.yaw, view.pitch, view.dist, w / h, map ? target : [0, 0, 0]));
  gl.enableVertexAttribArray(loc.a);
  const lines = (buffer, count, color, stride, kind) => { if (!count) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.vertexAttribPointer(loc.a, stride / 4 === 3 ? 3 : 4, gl.FLOAT, false, stride, 0);
    gl.uniform1f(loc.u, 0); gl.uniform3fv(loc.solid, color); gl.drawArrays(kind, 0, count); };
  lines(gridBuf, grid.length / 4, [.22, .24, .28], 16, gl.LINES);
  const points = (buffer, count, color, mode, size) => { if (!count) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.vertexAttribPointer(loc.a, 4, gl.FLOAT, false, 16, 0);
    gl.uniform1f(loc.u, color ? 0 : 1); if (color) gl.uniform3fv(loc.solid, color);

    const out = [el("p", {className: "sub", textContent: `${job.capture} · ${secs} s`}), bar, steps];
    const r = job.result;
    if (job.error) out.push(el("ul", {className: "notes"}, el("li", {className: "bad", textContent: job.error})));
    else if (r && job.kind === "calibrate") out.push(el("div", {className: "facts"}, fact(String(r.correlation), "gyro correlation"),
        fact(`${(r.residual_ratio * 100).toFixed(1)}%`, "residual"), fact(r.weak_axis ? "weak" : "good", "all three axes"),
        fact(r.camera_offset_m ? "measured" : "not measured", "camera offset")),
      el("ul", {className: "notes"}, el("li", {className: r.camera_offset_m ? "good" : "warn", textContent: r.camera_offset_m
        ? `MAX2 lens at ${r.camera_offset_m.map((v) => (v * 100).toFixed(1)).join(", ")} cm from the LiDAR (X, Y, Z)`
        : `Camera offset not measured: ${r.offset_note || "rotate more"}. Enter it before making a dataset.`})));
    else if (r) out.push(el("div", {className: "facts"}, fact(String(r.images), "images"), fact(String(r.keyframes ?? "?"), "photos"),
        fact(r.points ? `${Math.round(r.points / 1000)}k` : "?", "coloured points"), fact(r.masks ? String(r.masks) : "none", "masks")),
      el("ul", {className: "notes"}, r.too_fast ? el("li", {className: "warn", textContent: `${r.too_fast} video frames were turning too fast and were skipped`}) : null,
        r.masks ? null : el("li", {className: "warn", textContent: `No operator masks: ${r.mask_note || "off"}`}),
        el("li", {textContent: "Provisional: the camera offset and timing are not verified against the images."})),
      el("p", {className: "path", textContent: r.dataset}));
    const actions = el("div", {className: "actions"});
    if (!running && r && r.dataset && navigator.clipboard) { const copy = el("button", {className: "primary", type: "button", textContent: "Copy dataset path"});
      copy.addEventListener("click", () => navigator.clipboard.writeText(r.dataset).then(() => { copy.textContent = "Copied"; }, showError)); actions.append(copy); }
    const back = el("button", {className: "secondary", type: "button", textContent: running ? "Hide · keeps running" : "Done"});
    back.addEventListener("click", closeSheet); actions.append(back);
    out.push(actions); body.replaceChildren(...out); return;
  }
  // review of one capture
  const list = await captureList(); if (sheetMode !== mode) return;
  const info = list.find((c) => c.name === reviewCapture), busy = !!(job && !job.finished_ns);
  const G = reviewGuide, cal = P && P.calibration, video = !!(info && info.video.length);
  $("sheet-title").textContent = G ? "✓ Scan saved" : "Capture";
  const out = [el("p", {className: "sub", textContent: reviewCapture || ""}),
    el("div", {className: "facts"}, fact(info && info.duration_s != null ? fmtClock(info.duration_s) : "—", "duration"),
      fact(G ? `${G.distance_m.toFixed(1)} m` : "—", "walked"), fact(G ? String(G.photos) : "—", "photos"),
      fact(G && G.coverage != null ? `${Math.round(G.coverage * 100)}%` : "—", "coverage"))];
  const notes = [];
  if (G && G.coverage != null && G.coverage < .6) notes.push(["warn", "Some surfaces were seen from one direction only; scan them from another side before leaving."]);
  if (G && G.skipped) notes.push(["warn", `${G.skipped} stretch${G.skipped > 1 ? "es were" : " was"} too fast for photos`]);
  if (G && G.max_new_ground_m >= 8) notes.push(["warn", `Walked ${G.max_new_ground_m} m without returning to a scanned area; drift may remain`]);
  if (G && G.returns) notes.push(["good", `Returned to scanned areas ${G.returns} time${G.returns > 1 ? "s" : ""}`]);
  if (info && !video) notes.push(["bad", "No MAX2 video in this capture: it can be neither a calibration nor a dataset"]);
  if (!cal) notes.push(["", "No calibration yet. If this capture turned the fixed rig about all three axes, use it as the calibration."]);
  if (notes.length) out.push(el("ul", {className: "notes"}, ...notes.map(([c, t]) => el("li", {className: c, textContent: t}))));
  const make = el("button", {type: "button", textContent: "Make 3DGS dataset", className: cal ? "primary" : "secondary"});
  const calibrate = el("button", {type: "button", textContent: "Use as calibration", className: cal ? "secondary" : "primary"});
  make.disabled = !cal || busy || !video; calibrate.disabled = busy || !video;
  make.addEventListener("click", () => startJob("dataset")); calibrate.addEventListener("click", () => startJob("calibrate"));
  const again = el("button", {className: "secondary", type: "button", textContent: "Scan again"});
  again.addEventListener("click", closeSheet);
  out.push(el("div", {className: "actions"}, ...(cal ? [make, el("div", {className: "row"}, calibrate, again)]
    : [calibrate, el("div", {className: "row"}, make, again)])));
  if (busy) out.push(el("p", {className: "sub", textContent: `Another job is running (${job.capture}).`}));
  if (P) out.push(offsetInputs(P));
  body.replaceChildren(...out);
}
</script>
</body>
</html>
